apis:
- aid: antares-therapeutics-wordpress-rest
  name: Antares Therapeutics WordPress REST API
  description: >-
    The public WordPress REST API behind antaresrx.com. This is the content
    management surface for the corporate marketing site and its press-release /
    in-the-media newsroom -- it is NOT a first-party product API. Anonymous reads
    of published posts, pages, categories, media and tags are available under the
    wp/v2 namespace; all write operations and the site's MCP adapter route require
    authentication and return 401 to anonymous callers. Recorded here because it is
    a real, fetchable API surface on the company domain and it is what feeds the
    newsroom RSS pull.
  humanURL: https://antaresrx.com/wp-json/
