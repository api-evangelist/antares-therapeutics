aid: antares-therapeutics
name: Antares Therapeutics
description: >-
  Antares Therapeutics is a Boston- and South San Francisco-based precision medicine
  company developing small-molecule therapies against validated but previously
  undruggable targets in cancer and other serious diseases. Spun out of Scorpion
  Therapeutics following Eli Lilly's March 2025 acquisition of Scorpion, Antares
  launched in June 2025 with a $177 million Series A co-led by Omega Funds, Atlas
  Venture, Lightspeed Venture Partners, BVF Partners and Cormorant Asset Management.
  The company combines medicinal chemistry (proprietary compound libraries and
  next-generation mass spectrometry to find new chemical pockets), target biology
  (first-in-class preclinically validated targets and allosteric approaches to
  clinically validated ones), and predictive sciences (physics-based modeling,
  machine learning and molecular dynamics) to shorten discovery cycles. Its most
  advanced program is expected to enter the clinic in 2026, with multiple additional
  preclinical programs and discovery collaborations with Novartis, AstraZeneca and
  Pierre Fabre Laboratories. Antares is a private, preclinical-stage biotechnology
  company and publishes no public product API, developer portal or SDK surface.
